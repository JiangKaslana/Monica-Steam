name: Deploy Monica Steam Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "image/monica_launcher.webp"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - "image/monica_launcher.webp"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: "monica-steam-docs"
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: monica-steam

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare docs assets
        run: |
          mkdir -p docs-site/public
          cp image/monica_launcher.webp docs-site/public/monica-steam.webp

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm install

      - name: Build docs for Cloudflare Pages
        working-directory: docs-site
        env:
          CF_PAGES: "1"
        run: npm run docs:build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy docs-site/.vitepress/dist
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
