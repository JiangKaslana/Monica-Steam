name: Temporary Static Hosts Regression Validation

on:
  push:
    branches:
      - feat/upstream-hosts-network-fixes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run static and network regression tests
        run: >-
          ./gradlew testDebugUnitTest --stacktrace
          --tests 'takagi.ru.monica.steam.network.optimization.SteamCustomHostsDnsTest'
          --tests 'takagi.ru.monica.steam.network.optimization.SteamDynamicDnsTest'
          --tests 'takagi.ru.monica.steam.network.optimization.domain.SteamBuiltInHostsPresetTest'
          --tests 'takagi.ru.monica.steam.network.optimization.ui.SteamNetworkOptimizationIntegrationGuardTest'
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Monica-Steam-Static-Hosts-Fix
          path: app/build/outputs/apk/**/*.APK
          if-no-files-found: error
