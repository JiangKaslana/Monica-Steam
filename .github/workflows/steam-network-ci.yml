name: Steam Network CI

on:
  push:
    branches:
      - feat/steam-network-doh-settings
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble installable debug APKs
        run: ./gradlew assembleDebug --stacktrace -PpreviewVersionSuffix=doh-test

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Monica-Steam-DoH-test-APKs
          path: app/build/outputs/apk/debug/*.APK
          if-no-files-found: error
          retention-days: 14
