name: Steam Network CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Steam network tests
        run: >-
          ./gradlew testDebugUnitTest --stacktrace
          --tests 'takagi.ru.monica.steam.network.optimization.SteamDynamicDnsTest'
          --tests 'takagi.ru.monica.steam.network.optimization.diagnostics.SteamResolverBenchmarkTest'
          --tests 'takagi.ru.monica.steam.network.optimization.domain.SteamNetworkResolverSettingsTest'
          --tests 'takagi.ru.monica.steam.network.optimization.domain.SteamNetworkTargetCatalogTest'
          --tests 'takagi.ru.monica.steam.network.optimization.diagnostics.SteamDnsOptimizationScannerTest'
          --tests 'takagi.ru.monica.steam.network.optimization.ui.SteamNetworkOptimizationIntegrationGuardTest'

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: Monica-Steam-ECH-DoH-test-apk
          path: app/build/outputs/apk/debug/*.[Aa][Pp][Kk]
          if-no-files-found: error
          retention-days: 7
